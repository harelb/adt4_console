[pytest]
# ROS 2's launch_testing + launch_ros pytest plugins turn one test module's
# module-level skip (a missing optional package) into a skip of the whole suite
addopts = -p no:launch_testing -p no:launch_ros
testpaths = tests
markers =
    integration: needs real data (ADT4_CONSOLE_TEST_RUN) / a Neo4j test instance / ROS (skipped when unavailable)
filterwarnings =
    ignore::DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient`
