# Same rules as Awesome-DCIST-T4's .pre-commit-config.yaml: ruff's default
# lint set plus import sorting, and ruff-format.
target-version = "py312"

[lint]
extend-select = ["I"]

[lint.per-file-ignores]
# pytest fixtures imported from another test module are "redefined" as arguments
"tests/*" = ["F811"]
